#docker-compose.yaml

version: '3.9'

services:
  app:
    container_name: ${DOCKER_CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        DEPLOY_USER_NAME: ${DEPLOY_USER_NAME}
        APP_NAME: ${APP_NAME}
        APP_PORT: ${APP_PORT}

    command: python src/main.py

    volumes:
      - .:/${APP_NAME}

    env_file:
      - .env

    ports:
      - "${DOCKER_PORT}:${APP_PORT}"

    restart: unless-stopped

    tty: true
    stdin_open: true

    environment:
      - PYTHONIOENCODING=utf-8

    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: ${DOCKER_CONTAINER_NAME}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_/data
    command: >
      sh -c '
        mkdir -p /usr/local/etc/redis &&
        echo "bind 127.0.0.1" > /usr/local/etc/redis/redis.conf &&
        echo "appendonly yes" >> /usr/local/etc/redis/redis.conf &&
        echo "appendfsync everysec" >> /usr/local/etc/redis/redis.conf &&
        echo "user $REDIS_USER on >$REDIS_USER_PASSWORD allcommands allkeys" > /usr/local/etc/redis/users.acl &&
        redis-server /usr/local/etc/redis/redis.conf --aclfile /usr/local/etc/redis/users.acl
      '
    healthcheck:
      test: ["CMD", "redis-cli", "-u", "redis://${REDIS_USER}:${REDIS_USER_PASSWORD}@127.0.0.1:6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  redis_