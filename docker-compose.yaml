#docker-compose.yaml

version: '3.9'

services:
  app:
    container_name: ${DOCKER_CONTAINER_NAME}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
        DEPLOY_USER_NAME: ${DEPLOY_USER_NAME}
        APP_NAME: ${APP_NAME}
        APP_PORT: ${APP_PORT}

    command: python src/main.py

    volumes:
      - .:/${APP_NAME}

    env_file:
      - .env

    ports:
      - "${DOCKER_PORT}:${APP_PORT}"

    restart: unless-stopped

    tty: true
    stdin_open: true

    environment:
      - PYTHONIOENCODING=utf-8

    depends_on:
      redis:
        condition: service_healthy  # ✅ Исправлено: ждать, пока Redis здоров

  redis:
    image: redis:latest
    container_name: ${DOCKER_CONTAINER_NAME}_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_/data
    command: redis-server --requirepass ${REDIS_PASSWORD:-defaultpassword} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-defaultpassword}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

volumes:
  redis_